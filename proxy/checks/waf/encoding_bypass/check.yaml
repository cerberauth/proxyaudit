id: "waf.encoding_bypass"
name: "WAF Bypassed via Payload Encoding"
description: "For each baseline payload the WAF blocks in plain form, retries it with case variation, double URL-encoding, and Unicode (fullwidth) forms that a backend commonly decodes or normalizes back to the original string, flagging any variant that gets through — the filter inspects the raw bytes rather than what the backend will actually interpret."
link: "https://owasp.org/www-project-modsecurity-core-rule-set/"
