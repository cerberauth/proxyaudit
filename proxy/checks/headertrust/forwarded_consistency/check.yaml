id: "headertrust.forwarded_consistency"
name: "Forwarded Header Inconsistent With Legacy Headers"
description: "Sends distinct spoofed values in the RFC 7239 Forwarded header and the legacy X-Forwarded-For header in the same request, and tests whether both are honored/reflected, indicating the proxy and origin disagree on which client-IP header is authoritative."
