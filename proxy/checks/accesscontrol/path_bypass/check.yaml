id: "accesscontrol.path_bypass"
name: "Access Control Bypassed via Path Normalization"
description: "Probes a fixed list of common protected paths and, for any that deny access, retries case/encoding/traversal variants of the same path that a backend commonly normalizes away, testing whether a naive prefix-based access control can be bypassed by a differently-formatted request."
