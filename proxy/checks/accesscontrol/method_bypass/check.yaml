id: "accesscontrol.method_bypass"
name: "Access Control Bypassed via HTTP Method"
description: "Probes a fixed list of common protected paths and, for any that deny a GET, retries the identical path with a different HTTP verb, testing whether the access control only gates the verb it expects rather than every verb the backend will route to the same handler."
